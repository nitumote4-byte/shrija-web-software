services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shrija
      POSTGRES_PASSWORD: shrija
      POSTGRES_DB: shrija
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shrija -d shrija']
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - shrija_pg:/var/lib/postgresql/data

volumes:
  shrija_pg:
